appId: com.alifshohoj.print
productName: ALIF SHOHOJ PRINT
directories:
  output: artifacts/releases
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!**/*.map'
asar: true
npmRebuild: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/pdf-to-printer/dist/SumatraPDF-3.4.6-32.exe
win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
  artifactName: ALIF-SHOHOJ-PRINT-${version}-Setup-${arch}.${ext}
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ALIF SHOHOJ PRINT
  uninstallDisplayName: ALIF SHOHOJ PRINT
  deleteAppDataOnUninstall: false
