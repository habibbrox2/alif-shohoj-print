name: Signed Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-installer:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw 'Add the WINDOWS_CERTIFICATE_BASE64 repository secret before running this workflow.'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'alif-shohoj-print-signing.pfx'
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          "CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build signed installer
        run: npm run app:dist:signed
        env:
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: alif-shohoj-print-signed-installer
          path: artifacts/releases/*.exe
          if-no-files-found: error
          retention-days: 14
