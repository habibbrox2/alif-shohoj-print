name: Windows Build

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (for faster builds)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python (for native module builds)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Verify native modules
        run: |
          echo "Checking better-sqlite3..."
          node -e "const db = require('better-sqlite3'); console.log('better-sqlite3 OK:', db.version);"
          echo "Checking pdf-to-printer..."
          node -e "const p = require('pdf-to-printer'); console.log('pdf-to-printer OK');"
        shell: bash

      - name: Run linting
        if: ${{ !inputs.skip_tests }}
        run: npm run lint
        shell: bash

      - name: Run desktop tests
        if: ${{ !inputs.skip_tests }}
        run: npm run test:desktop
        shell: bash

      - name: Run renderer tests
        if: ${{ !inputs.skip_tests }}
        run: npm run test:renderer
        shell: bash

      - name: Build renderer
        run: npm run build
        shell: bash

      - name: Build Electron main process
        run: npm run build:electron
        shell: bash

      - name: Package Windows NSIS installer
        run: npx electron-builder --win nsis
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        run: ls -la artifacts/releases/
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alif-Shohoj-Print-setup
          path: artifacts/releases/*.exe
          retention-days: 60
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Alif Shohoj Print by AAA Tech Solutions

            ### Release ${{ github.ref_name }}

            This release contains the Windows installer for Alif Shohoj Print.

            ### Download

            - [Windows 64-bit Installer](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Alif-Shohoj-Print-${{ github.ref_name }}-Setup-x64.exe)
            - [Windows 32-bit Installer](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Alif-Shohoj-Print-${{ github.ref_name }}-Setup-ia32.exe)
          files: |
            release-artifacts/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}