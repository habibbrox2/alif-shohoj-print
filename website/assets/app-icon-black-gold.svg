  </defs>
  
  <!-- Main 'A' monogram -->
  <path d="M156 85 L221 241 Q234 215 255 241 L291 85 L226 341 L161 85 Z" fill="white" stroke="url(#blackGradient)" stroke-width="8" stroke-linejoin="round"/>
  <path d="M169 209 Q238 290 322 147 L351 182 Q210 362 121 281 Z" fill="url(#goldGradient)"/>
  
