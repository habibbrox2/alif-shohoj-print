<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="url(#goldGradient)" rx="20"/>
  <defs>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0A6"/>
      <stop offset=".28" stop-color="#D99A19"/>
      <stop offset=".55" stop-color="#FFE28A"/>
      <stop offset=".78" stop-color="#B87908"/>
      <stop offset="1" stop-color="#F7D66A"/>
    </linearGradient>
    <linearGradient id="blackGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303030"/>
