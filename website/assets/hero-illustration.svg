<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef9f3"/>
      <stop offset="100%" style="stop-color:#fdebd0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#fdf2e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#e67e22" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="400" fill="url(#bgGrad)" rx="20"/>
  
  <!-- Main window mockup -->
  <rect x="50" y="40" width="400" height="320" rx="16" fill="white" filter="url(#shadow)" stroke="#e8d5c4" stroke-width="1"/>
  
  <!-- Title bar -->
  <rect x="50" y="40" width="400" height="40" rx="16" fill="#f8f4f0"/>
  <rect x="50" y="64" width="400" height="16" fill="#f8f4f0"/>
  <circle cx="75" cy="60" r="6" fill="#e74c3c"/>
  <circle cx="95" cy="60" r="6" fill="#f1c40f"/>
  <circle cx="115" cy="60" r="6" fill="#2ecc71"/>
  <text x="250" y="65" font-family="Segoe UI, sans-serif" font-size="12" fill="#7f8c8d" text-anchor="middle">Alif Shohoj Print — Dashboard</text>
  
  <!-- Sidebar -->
  <rect x="50" y="80" width="90" height="280" fill="#fdf2e9"/>
  <rect x="60" y="95" width="70" height="8" rx="4" fill="#e67e22" opacity="0.3"/>
  <rect x="60" y="115" width="70" height="8" rx="4" fill="#e67e22" opacity="0.2"/>
  <rect x="60" y="135" width="70" height="8" rx="4" fill="#e67e22" opacity="0.2"/>
  <rect x="60" y="155" width="70" height="8" rx="4" fill="#e67e22" opacity="0.2"/>
  <rect x="60" y="175" width="70" height="8" rx="4" fill="#e67e22" opacity="0.2"/>
  
  <!-- Main content area -->
  <rect x="150" y="90" width="290" height="60" rx="8" fill="#fef9f3"/>
  <text x="165" y="115" font-family="Segoe UI, sans-serif" font-size="11" fill="#7f8c8d">Today's Summary</text>
  <text x="165" y="135" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#2c3e50">৳ 2,450 revenue | 12 orders</text>
  
  <!-- Order cards -->
  <rect x="150" y="160" width="135" height="70" rx="8" fill="white" stroke="#e8d5c4" stroke-width="1"/>
  <circle cx="170" cy="185" r="12" fill="#e67e22" opacity="0.2"/>
  <text x="170" y="190" font-family="Segoe UI, sans-serif" font-size="12" fill="#e67e22" text-anchor="middle">🖨</text>
  <text x="195" y="180" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#2c3e50">Order #1042</text>
  <text x="195" y="195" font-family="Segoe UI, sans-serif" font-size="9" fill="#7f8c8d">A4 Color × 3</text>
  <rect x="195" y="205" width="50" height="14" rx="7" fill="#27ae60" opacity="0.2"/>
  <text x="220" y="215" font-family="Segoe UI, sans-serif" font-size="8" fill="#27ae60" text-anchor="middle">Approved</text>
  
  <rect x="305" y="160" width="135" height="70" rx="8" fill="white" stroke="#e8d5c4" stroke-width="1"/>
  <circle cx="325" cy="185" r="12" fill="#3498db" opacity="0.2"/>
  <text x="325" y="190" font-family="Segoe UI, sans-serif" font-size="12" fill="#3498db" text-anchor="middle">📱</text>
  <text x="350" y="180" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#2c3e50">Order #1043</text>
  <text x="350" y="195" font-family="Segoe UI, sans-serif" font-size="9" fill="#7f8c8d">ID Card × 2</text>
  <rect x="350" y="205" width="50" height="14" rx="7" fill="#f39c12" opacity="0.2"/>
  <text x="375" y="215" font-family="Segoe UI, sans-serif" font-size="8" fill="#f39c12" text-anchor="middle">Pending</text>
  
  <!-- Printer status -->
  <rect x="150" y="240" width="290" height="50" rx="8" fill="#fef9f3"/>
  <text x="165" y="260" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#2c3e50">Printer Fleet</text>
  <circle cx="175" cy="275" r="5" fill="#27ae60"/>
  <text x="185" y="279" font-family="Segoe UI, sans-serif" font-size="9" fill="#7f8c8d">HP LaserJet (Online)</text>
  <circle cx="300" cy="275" r="5" fill="#27ae60"/>
  <text x="310" y="279" font-family="Segoe UI, sans-serif" font-size="9" fill="#7f8c8d">Canon (Online)</text>
  
  <!-- Counter status -->
  <rect x="150" y="300" width="290" height="40" rx="8" fill="#fef9f3"/>
  <text x="165" y="320" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#2c3e50">Counters</text>
  <circle cx="230" cy="320" r="4" fill="#27ae60"/>
  <text x="240" y="324" font-family="Segoe UI, sans-serif" font-size="9" fill="#7f8c8d">Counter 1 (Online)</text>
  <circle cx="340" cy="320" r="4" fill="#e74c3c"/>
  <text x="350" y="324" font-family="Segoe UI, sans-serif" font-size="9" fill="#7f8c8d">Counter 2 (Offline)</text>
</svg>